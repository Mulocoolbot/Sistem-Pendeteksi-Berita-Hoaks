name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-smoke-test:
    name: Quality & Blackbox Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Blackbox smoke test
        shell: bash
        run: |
          set -euo pipefail

          LOG_FILE="/tmp/next-smoke.log"
          API_BODY_FILE="/tmp/next-smoke-api.json"

          npx next start -p 3000 > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          trap "pkill -P $SERVER_PID 2>/dev/null || true; kill $SERVER_PID 2>/dev/null || true; rm -f $API_BODY_FILE" EXIT

          READY=0
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Next.js server exited prematurely before becoming ready."
              cat "$LOG_FILE"
              exit 1
            fi

            if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3000/; then
              READY=1
              echo "Next.js server is ready on http://127.0.0.1:3000 (attempt ${i}/30)."
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for http://127.0.0.1:3000 after 30 seconds."
            cat "$LOG_FILE"
            exit 1
          fi

          HOME_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:3000/)
          echo "GET / -> HTTP ${HOME_STATUS}"
          if [ "$HOME_STATUS" -ne 200 ]; then
            echo "Expected HTTP 200 from GET /, got HTTP ${HOME_STATUS}."
            cat "$LOG_FILE"
            exit 1
          fi

          API_STATUS=$(curl -sS -o "$API_BODY_FILE" -w "%{http_code}" --max-time 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{}" \
            http://127.0.0.1:3000/api/analyze/url)
          echo "POST /api/analyze/url -> HTTP ${API_STATUS}"
          cat "$API_BODY_FILE"
          echo ""
          if [ "$API_STATUS" -ne 400 ]; then
            echo "Expected HTTP 400 from POST /api/analyze/url with {}, got HTTP ${API_STATUS}."
            cat "$LOG_FILE"
            exit 1
          fi
