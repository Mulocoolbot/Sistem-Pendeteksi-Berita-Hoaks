name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Validate required Vercel secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          MISSING=()
          if [ -z "${VERCEL_TOKEN:-}" ]; then MISSING+=("VERCEL_TOKEN"); fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then MISSING+=("VERCEL_ORG_ID"); fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then MISSING+=("VERCEL_PROJECT_ID"); fi

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Secret GitHub Actions untuk deployment Vercel belum dikonfigurasi: ${MISSING[*]}"
            echo "Tambahkan secret yang hilang pada GitHub Repository -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Seluruh secret deployment Vercel (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) tersedia."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifacts with Vercel CLI
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
